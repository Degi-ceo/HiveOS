name: CI

# Catches the audit's root cause (HIVEOS_AUDIT §0): a casing/import bug that only
# surfaces on Linux, never on the author's mac. Every phase's verify runs here too.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dashboard-preview:
    name: Dashboard preview — real browser verification
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit and interaction tests
        run: npm test
      - name: Preview coverage gate
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Smoke every preview screen
        run: npm run test:e2e:preview
      - name: Exercise real user journeys and responsive layouts
        run: npm run test:e2e:journeys
      - name: Generate the verified screenshot package
        run: npm run screenshots:preview
      - name: Upload verified mockups and machine-readable manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HiveOS-UI-v0.8.5-mockups
          path: |
            HiveOS_UI_v0.8.5.zip
            dashboard/screenshots-output/manifest.json
          if-no-files-found: error

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Compile check
        run: python -m compileall -q src/hive
      - name: Import smoke (the casing guard)
        run: python -c "import hive; from hive.core import soul, approval, config, doctor"
      - name: Tests
        run: pytest -q

  host-selection-root:
    name: Host selection publication as root (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Exercise host-owned credential publisher with root ownership
        run: sudo "$(command -v python)" -m pytest -q tests/test_m55_host_selection_publish.py

  managed-systemd-launch:
    name: Managed systemd selection and launch (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Exercise the real systemd credential and selected process
        run: sudo env HIVE_TEST_REAL_SYSTEMD=1 "$(command -v python)" -m pytest -q tests/test_m56_real_systemd_launch.py

  m0-behavioral-regressions:
    name: M0 behavioral security regressions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run executable M0 boundary harness
        run: pytest -q tests/test_m0_behavioral_regressions.py

  pinned-container-smoke:
    name: Pinned candidate diagnostic in real Docker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Pre-pull the public Python image
        run: docker pull python:3.12-slim
      - name: Exercise digest-pinned transport without credentials
        shell: bash
        run: |
          image="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          HIVE_TEST_PINNED_IMAGE="$image" python -m pytest -q -rs tests/test_m47_real_pinned_container.py

  terminal-operator-portability:
    name: Terminal operator portability (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Exercise terminal sessions, public events, and native shell
        run: python -m pytest -q tests/test_m3_terminal_sessions.py tests/test_iteration_stream.py

  evals:
    # SPRINT_6 P-B: regression gate (closes #70). Runs the golden QA dataset
    # against a real isolated HiveOS runtime with a deterministic model boundary.
    # This exercises orchestration, tools, memory and run evidence without paid
    # model calls. A failing eval here blocks merge. Uploads the
    # HTML + JUnit reports as workflow artifacts so reviewers can inspect
    # failures inline without rerunning locally.
    #
    # permissions: read-only by default. The evals job only reads the repo
    # and uploads artifacts; it does not write back. Fork PRs can still run
    # this job but artifact uploads from forks are scoped to the PR head —
    # reviewers must inspect via the PR's "Files changed" / "Checks" tab, not
    # via reusable artifact links in the main repo.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run golden QA against isolated HiveOS
        run: |
          mkdir -p evals/reports
          hive-eval run evals/datasets/golden_qa.jsonl \
            --target hive-runtime \
            --judge target \
            --concurrency 1 \
            --report junit_xml=evals/reports/golden_qa.xml \
            --report html=evals/reports/golden_qa.html
      - name: Run tool-evidence smoke against isolated HiveOS
        run: |
          hive-eval run evals/datasets/runtime_smoke.jsonl \
            --target hive-runtime \
            --concurrency 1 \
            --report junit_xml=evals/reports/runtime_smoke.xml \
            --report html=evals/reports/runtime_smoke.html
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: warn
