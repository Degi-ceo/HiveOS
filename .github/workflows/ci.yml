name: CI

# Catches the audit's root cause (HIVEOS_AUDIT §0): a casing/import bug that only
# surfaces on Linux, never on the author's mac. Every phase's verify runs here too.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Compile check
        run: python -m compileall -q src/hive
      - name: Import smoke (the casing guard)
        run: python -c "import hive; from hive.core import soul, approval, config, doctor"
      - name: Tests
        run: pytest -q

  evals:
    # SPRINT_6 P-B: regression gate (closes #70). Runs the golden QA dataset
    # against the deterministic mock target — proves the gate works without
    # burning real LLM tokens. A failing eval here blocks merge. Uploads the
    # HTML + JUnit reports as workflow artifacts so reviewers can inspect
    # failures inline without rerunning locally.
    #
    # permissions: read-only by default. The evals job only reads the repo
    # and uploads artifacts; it does not write back. Fork PRs can still run
    # this job but artifact uploads from forks are scoped to the PR head —
    # reviewers must inspect via the PR's "Files changed" / "Checks" tab, not
    # via reusable artifact links in the main repo.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run golden_qa dataset against mock target
        run: |
          mkdir -p evals/reports
          hive-eval run evals/datasets/golden_qa.jsonl \
            --target mock \
            --report junit_xml=evals/reports/golden_qa.xml \
            --report html=evals/reports/golden_qa.html
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: warn
