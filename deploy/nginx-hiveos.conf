# HiveOS nginx reverse proxy
# Deploy: sudo cp deploy/nginx-hiveos.conf /etc/nginx/sites-available/hiveos
#         sudo ln -s /etc/nginx/sites-available/hiveos /etc/nginx/sites-enabled/hiveos
#         sudo nginx -t && sudo systemctl reload nginx
#
# For TLS add certbot: sudo certbot --nginx -d hive.yourdomain.com

server {
    listen 80;
    # Replace YOUR_SERVER_IP with your server's IP address or domain name.
    # Example: server_name 1.2.3.4 hive.example.com;
    server_name YOUR_SERVER_IP hive.yourdomain.com;

    # Mission Control dashboard (React SPA)
    location /app {
        proxy_http_version 1.1;
        proxy_pass         http://127.0.0.1:8088;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HiveOS API + SSE streaming + WebSocket (/ws)
    location / {
        proxy_http_version 1.1;                  # required for WebSocket and SSE keep-alive
        proxy_pass         http://127.0.0.1:8088;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Required for SSE streaming (/chat/stream)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Telegram webhook — requires HTTPS; self-signed cert accepted by Telegram when
# registered via setWebhook with certificate= parameter.
server {
    listen 8443 ssl;
    # Replace YOUR_SERVER_IP with your server's IP address (must match the HTTP block above).
    server_name YOUR_SERVER_IP;

    ssl_certificate     /home/hive/HiveOS/deploy/hive-telegram.pem;
    ssl_certificate_key /home/hive/HiveOS/deploy/hive-telegram.key;

    location /telegram/webhook {
        proxy_http_version 1.1;
        proxy_pass         http://127.0.0.1:8088;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
