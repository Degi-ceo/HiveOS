# HiveOS nginx reverse proxy
# Deploy: sudo cp deploy/nginx-hiveos.conf /etc/nginx/sites-available/hiveos
#         sudo ln -s /etc/nginx/sites-available/hiveos /etc/nginx/sites-enabled/hiveos
#         sudo nginx -t && sudo systemctl reload nginx
#
# For TLS add certbot: sudo certbot --nginx -d hive.yourdomain.com

server {
    listen 80;
    server_name 46.224.161.38 hive.yourdomain.com;

    # Mission Control dashboard (React SPA)
    location /app {
        proxy_pass         http://127.0.0.1:8088;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HiveOS API + SSE streaming
    location / {
        proxy_pass         http://127.0.0.1:8088;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Required for SSE streaming (/chat/stream)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
