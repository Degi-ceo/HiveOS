[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hive"
version = "0.2.0-dev"
description = "HiveOS — Hive's own Python-first autonomous agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kamil Siedlarz" }]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Active memory layer — the designated provider (Docs/references/MNEMOSYNE_REFERENCE.md).
memory = ["mnemosyne-memory>=0.1"]
# Voice surface (install on the voice host only).
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
hive = "hive.surfaces.cli:main"
hive-doctor = "hive.core.doctor:run"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
